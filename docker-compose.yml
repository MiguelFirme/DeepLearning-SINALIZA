version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sinaliza-backend
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts
      - ./data:/app/data
    environment:
      - SINALIZA_DEVICE=cpu
      - SINALIZA_DEBUG=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; data=json.load(urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)); assert data['model_loaded'] and data['num_classes'] == 23"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: sinaliza-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
