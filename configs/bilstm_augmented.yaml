# Experimento controlado: mesmas classes/splits do bilstm_focus, com
# variações moderadas somente nas amostras de treino.
_base_: "bilstm_focus.yaml"

augmentation:
  enabled: true
  prob: 0.8
  gaussian_noise: { prob: 0.30, std: 0.002 }
  rotation_jitter: { prob: 0.30, max_angle: 3 }
  temporal_crop: { prob: 0.20, min_ratio: 0.90 }
  speed_warp: { prob: 0.30, min_rate: 0.90, max_rate: 1.10 }
  scale_jitter: { prob: 0.0 }
  translation_jitter: { prob: 0.0 }
  frame_drop: { prob: 0.0 }
  landmark_mask: { prob: 0.0 }
  temporal_shift: { prob: 0.0 }
